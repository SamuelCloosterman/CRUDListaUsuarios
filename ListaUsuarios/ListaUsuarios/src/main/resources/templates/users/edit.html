
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Usuário</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>

<div class="container pt-4">

    <h1>Editar Usuário</h1>
    <hr>

    <form th:action="@{/users/update}"
          th:object="${user}"
          method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>
            <input type="text"
                   class="form-control"
                   th:field="*{name}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">Arroba</label>
            <input type="text"
                   class="form-control"
                   th:field="*{arroba}"
                   required>
        </div>

        <div class="mb-3">
            <label class="form-label">CPF</label>
            <input type="text"
                   class="form-control"
                   th:field="*{cpf}"
                   required>
        </div>

        <button type="submit" class="btn btn-success">
            Salvar alterações
        </button>

        <a th:href="@{/users/index}" class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

</body>
</html>
