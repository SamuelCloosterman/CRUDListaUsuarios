<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>
<div class="container pt-3">

    <a th:href="@{/users/index}" class="btn btn-primary float-end">
        Voltar
    </a>

    <h1>Novo Usuário</h1>
    <hr>

    <form method="post"
          th:action="@{/users/create}"
          th:object="${user}">

        <div class="mb-3">
            <label for="name" class="form-label">Nome</label>
            <input type="text"
                   class="form-control"
                   id="name"
                   th:field="*{name}">
        </div>

        <div class="mb-3">
            <label for="arroba" class="form-label">Arroba</label>
            <input type="text"
                   class="form-control"
                   id="arroba"
                   th:field="*{arroba}">
        </div>

        <div class="mb-3">
            <label for="cpf" class="form-label">CPF</label>
            <input type="text"
                   class="form-control"
                   id="cpf"
                   th:field="*{cpf}">
        </div>

        <button type="submit" class="btn btn-primary">
            Cadastrar
        </button>

    </form>
</div>
</body>
</html>
