<!doctype html> <html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Usuários</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

</head> <body> <div class="container pt-3">
    <!-- ==================== -->
    <!-- USUÁRIOS -->
    <!-- ==================== -->

    <a th:href="@{'/users/new'}"
       class="btn btn-primary float-end">
        Novo Usuário
    </a>

    <h1>
        Lista de Usuários
        (<span th:text="${userSize}"></span>)
    </h1>

    <hr>

    <table class="table">

        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Arroba</th>
            <th scope="col">CPF</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="user, status : ${users}">

            <th scope="row"
                th:text="${status.count}">
                1
            </th>

            <td th:text="${user.name}">
                Mark
            </td>

            <td th:text="${user.arroba}">
                @mark
            </td>

            <td th:text="${user.cpf}">
                000.000.000-00
            </td>

            <td>

                <a th:href="@{'/users/edit/' + ${user.id}}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <form th:action="@{/users/delete/{id}(id=${user.id})}"
                      method="post"
                      style="display: inline;">

                    <button type="submit" class="btn btn-danger btn-sm">
                        Excluir
                    </button>
                </form>

            </td>

        </tr>

        </tbody>

    </table>

</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"> </script> </body> </html>
