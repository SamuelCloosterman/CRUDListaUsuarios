<!doctype html> <html lang="pt-BR" xmlns:th="http://www.w3.org/1999/xhtml"> <head> <meta charset="utf-8"> <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Usuários e Animais</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

</head> <body> <div class="container pt-3">
    <!-- ==================== -->
    <!-- USUÁRIOS -->
    <!-- ==================== -->

    <a th:href="@{'/users/new'}"
       class="btn btn-primary float-end">
        Novo Usuário
    </a>

    <h1>
        Lista de Usuários
        (<span th:text="${userSize}">0</span>)
    </h1>

    <hr>

    <table class="table">

        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Arroba</th>
            <th scope="col">CPF</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="user : ${users}">

            <th scope="row"
                th:text="${user.id}">
                1
            </th>

            <td th:text="${user.name}">
                Mark
            </td>

            <td th:text="${user.arroba}">
                @mark
            </td>

            <td th:text="${user.cpf}">
                000.000.000-00
            </td>

            <td>

                <a th:href="@{'/users/edit/' + ${user.id}}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{'/users/delete/' + ${user.id}}"
                   class="btn btn-danger btn-sm">
                    Excluir
                </a>

            </td>

        </tr>

        </tbody>

    </table>


    <!-- ==================== -->
    <!-- ESPAÇO -->
    <!-- ==================== -->

    <div class="my-5"></div>


    <!-- ==================== -->
    <!-- ANIMAIS -->
    <!-- ==================== -->

    <a th:href="@{'/animals/new'}"
       class="btn btn-success float-end">
        Novo Animal
    </a>

    <h1>
        Lista de Animais
        (<span th:text="${animalSize}">0</span>)
    </h1>

    <hr>

    <table class="table">

        <thead>
        <tr>
            <th scope="col">#</th>
            <th scope="col">Nome</th>
            <th scope="col">Raça</th>
            <th scope="col">Idade</th>
            <th scope="col">Nome Científico</th>
            <th scope="col">Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="animal : ${animals}">

            <th scope="row"
                th:text="${animal.id}">
                1
            </th>

            <td th:text="${animal.nome}">
                Rex
            </td>

            <td th:text="${animal.raca}">
                Pastor Alemão
            </td>

            <td th:text="${animal.idade}">
                5
            </td>

            <td th:text="${animal.nomeCientifico}">
                Canis lupus familiaris
            </td>

            <td>

                <a th:href="@{'/animals/edit/' + ${animal.id}}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:href="@{'/animals/delete/' + ${animal.id}}"
                   class="btn btn-danger btn-sm">
                    Excluir
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div> <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwxHj09JcYn3nv7wiPVlz7YYwJrVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"> </script> </body> </html>
